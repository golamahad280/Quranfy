name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Quranfy Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies and build web bundle
        run: |
          npm ci || npm install
          npm run build

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Quranfy APK output
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk Quranfy.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Quranfy.apk
          ls -lh Quranfy.apk release/Quranfy.apk

      - name: Upload Quranfy-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quranfy-APK
          path: Quranfy.apk
          if-no-files-found: error
