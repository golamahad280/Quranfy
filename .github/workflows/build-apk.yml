name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Ensure Android platform & sync Capacitor assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure local.properties for CI SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties

      - name: Verify sounds and fonts synced to Android assets
        run: |
          test -d android/app/src/main/assets/public/sounds
          ls -la android/app/src/main/assets/public/sounds
          ls android/app/src/main/assets/public/assets/*.woff2 | head -n 10

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Prepare Quranfy.apk outputs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Quranfy.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Quranfy.apk
          ls -lh Quranfy.apk release/Quranfy.apk

      - name: Upload Quranfy-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quranfy-APK
          path: Quranfy.apk
          if-no-files-found: error
