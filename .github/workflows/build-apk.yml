name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - 'android-keystore/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Add and sync Android platform
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Patch Android project
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ['INTERNET', 'WAKE_LOCK', 'POST_NOTIFICATIONS',
                   'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK']
          add = ''.join(
              '    <uses-permission android:name="android.permission.%s" />\n' % x
              for x in perms if 'permission.%s"' % x not in s)
          s = s.replace('</manifest>', add + '</manifest>')
          if 'AndroidForegroundService' not in s:
              svc = ('        <service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService"'
                     ' android:foregroundServiceType="mediaPlayback" android:exported="false" />\n'
                     '        <receiver android:name="io.capawesome.capacitorjs.plugins.foregroundservice.NotificationActionBroadcastReceiver"'
                     ' android:exported="false" />\n')
              s = s.replace('</application>', svc + '    </application>')
          open(p, 'w').write(s)
          PY
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_quranfy.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M13.3,3.5C11.1,3.9 9.4,5.7 9.4,8.0C9.4,10.5 11.4,12.5 13.9,12.5C15.0,12.5 16.0,12.1 16.8,11.4C16.1,13.1 14.5,14.2 12.6,14.2C9.9,14.2 7.8,12.1 7.8,9.4C7.8,6.5 10.2,3.8 13.3,3.5Z" />
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M4.5,15.3C4.5,14.5 5.1,13.9 5.9,13.9C8.2,13.9 10.4,14.6 12.0,15.8C13.6,14.6 15.8,13.9 18.1,13.9C18.9,13.9 19.5,14.5 19.5,15.3V20.0C19.5,20.7 19.0,21.2 18.3,21.2C16.0,21.2 13.9,21.8 12.0,22.8C10.1,21.8 8.0,21.2 5.7,21.2C5.0,21.2 4.5,20.7 4.5,20.0V15.3Z" />
          </vector>
          EOF
          sed -i "s/minSdkVersion = .*/minSdkVersion = 24/" android/variables.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon-only.png
          cp public/pwa-512x512.png assets/icon-foreground.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0E0B1F' || echo "icon generation skipped"

      - name: Prepare Android SDK (preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Keep one signing key so updates install over old versions
        run: |
          mkdir -p android-keystore ~/.android
          if [ ! -f android-keystore/debug.keystore ]; then
            keytool -genkeypair -v -keystore android-keystore/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "NEW_KEY=1" >> $GITHUB_ENV
          fi
          cp android-keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Put APK in apk/ folder
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Quranfy.apk
          cp apk/Quranfy.apk "apk/Quranfy-build${GITHUB_RUN_NUMBER}.apk"
          ls -lh apk
          echo "APK ready: apk/Quranfy.apk" >> $GITHUB_STEP_SUMMARY

      - name: Commit apk folder
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk android-keystore
          git commit -m "chore: update APK [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push

      - name: Publish release (permanent download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Quranfy latest APK
          files: apk/Quranfy.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: Quranfy-APK
          path: apk/Quranfy.apk
